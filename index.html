    <title>Inara Kelly do Carmo</title>
    <script>
      // Aplica a paleta e a fonte salvas antes de desenhar a página (evita piscar).
      // O modo claro/escuro não é salvo: começa sempre pelo do sistema (via CSS).
      try {
        if (localStorage.getItem('paleta') === 'terra') document.documentElement.dataset.paleta = 'terra'
        var fonte = localStorage.getItem('fonte')
        // qualquer conjunto definido em src/index.css (nomes desconhecidos caem no padrão)
        if (fonte && /^[a-z-]+$/.test(fonte) && fonte !== 'marcante') document.documentElement.dataset.fonte = fonte
        localStorage.removeItem('modo') // limpa escolha salva pela versão anterior
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
